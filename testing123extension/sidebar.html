<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Widget Hub</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="container">
        <h2>My Widgets</h2>

        <!-- Widget 1: Quick Note / To-Do -->
        <div class="widget">
            <h3>Quick Note</h3>
            <textarea id="quick-note" placeholder="Type a quick note..."></textarea>
        </div>

        <!-- Widget 2: Simple Counter / Tracker -->
        <div class="widget">
            <h3>Counter Widget</h3>
            <p>Count: <span id="counter-value">0</span></p>
            <button id="increment-btn">Add +1</button>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
